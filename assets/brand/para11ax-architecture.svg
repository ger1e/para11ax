<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="t d"><title id="t">PARA11AX request path</title><desc id="d">GER1E-normalized PARA11AX request path showing admission, Provider Value Scheduler v1.0, fixed egress, Evidence v2, Intelligence Kernel v1.0 and analyst projections.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020403"/><stop offset=".55" stop-color="#061008"/><stop offset="1" stop-color="#020403"/></linearGradient><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:900;letter-spacing:1.4px}</style></defs><rect width="720" height="760" rx="12" fill="url(#bg)"/><rect x="2" y="2" width="716" height="756" rx="12" fill="none" stroke="#39FF14" stroke-opacity=".3"/><g class="m" font-size="15" letter-spacing="1.8" fill="#8DA391"><text x="26" y="30">REQUEST PATH</text><text x="694" y="30" text-anchor="end">FIXED EGRESS</text></g><path d="M26 48H694" stroke="#39FF14" stroke-opacity=".3"/><g transform="translate(26 66)"><rect width="668" height="92" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="29" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">01 // CALLER</text><text x="20" y="66" class="h" font-size="22" fill="#F7FFF6">CLIENT · ANALYST UI · CLI · MALTEGO</text></g><path d="M360 158V178" stroke="#39FF14" stroke-opacity=".45" stroke-width="3"/><g transform="translate(26 178)"><rect width="668" height="98" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="29" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">02 // ADMISSION</text><text x="20" y="63" class="h" font-size="22" fill="#F7FFF6">AUTH → CLASSIFIER → FIXED PROFILE</text><text x="20" y="88" class="m" font-size="17" fill="#39FF14">fast · standard · full // no provider override</text></g><path d="M360 276V296" stroke="#39FF14" stroke-opacity=".45" stroke-width="3"/><g transform="translate(26 296)"><rect width="668" height="112" rx="10" fill="#071007" stroke="#39FF14" stroke-opacity=".42"/><text x="20" y="29" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">03 // EXECUTION</text><text x="20" y="64" class="h" font-size="22" fill="#F7FFF6">VALUE SCHEDULER v1.0 → safeFetch</text><text x="20" y="92" class="m" font-size="17" fill="#39FF14">static value order · max 4 active · 2 attempts · 20 s deadline</text></g><path d="M360 408V428" stroke="#39FF14" stroke-opacity=".45" stroke-width="3"/><g transform="translate(26 428)"><rect width="668" height="98" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="29" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">04 // PROVIDER FABRIC</text><text x="20" y="65" class="h" font-size="22" fill="#39FF14">39 FIXED SOURCES</text><text x="300" y="70" class="m" font-size="17" fill="#F7FFF6">IP REF: 24 PROVIDERS / 48 CALLS</text></g><path d="M360 526V546" stroke="#39FF14" stroke-opacity=".45" stroke-width="3"/><g transform="translate(26 546)"><rect width="668" height="88" rx="10" fill="#050805" stroke="#39FF14" stroke-opacity=".24"/><text x="20" y="29" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">05 // EVIDENCE</text><text x="20" y="64" class="h" font-size="22" fill="#F7FFF6">EVIDENCE V2 → TYPED CORRELATION</text></g><path d="M360 634V654" stroke="#39FF14" stroke-opacity=".45" stroke-width="3"/><g transform="translate(26 654)"><rect width="668" height="80" rx="10" fill="#071007" stroke="#39FF14" stroke-opacity=".48"/><text x="20" y="28" class="m" font-size="15" letter-spacing="1.8" fill="#8DA391">06 // ANALYSIS</text><text x="20" y="60" class="h" font-size="22" fill="#F7FFF6">KERNEL v1.0 → DECISION → GRAPH / GUIDANCE / REPORT</text></g></svg>