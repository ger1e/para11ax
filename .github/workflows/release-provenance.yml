name: release-provenance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the version tag and GitHub Release after verification'
        required: true
        default: false
        type: boolean
      version:
        description: 'Release version; must match package.json when publishing'
        required: true
        default: 'v2.0.0'
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          check-latest: false

      - name: Validate manual release intent
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo '::error::Manual release publication is allowed only from main.'
            exit 1
          }
          [[ "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo '::error::Version must be strict vMAJOR.MINOR.PATCH.'
            exit 1
          }
          package_version="v$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          test "$REQUESTED_VERSION" = "$package_version" || {
            echo "::error::Requested version $REQUESTED_VERSION does not match package.json $package_version."
            exit 1
          }

      - name: Verify release source
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev
          npm run check
          node scripts/generate-release-manifest.mjs --check

  attest:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          check-latest: false

      - name: Prepare deterministic dependency state
        run: npm ci --ignore-scripts

      - name: Generate SBOM and build provenance
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm sbom --sbom-format=cyclonedx --sbom-type=application > sbom.cdx.json
          npm sbom --sbom-format=spdx --sbom-type=application > sbom.spdx.json
          node <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';

          const releaseVersion = process.env.GITHUB_REF?.startsWith('refs/tags/v')
            ? process.env.GITHUB_REF_NAME
            : (process.env.REQUESTED_VERSION || null);
          const provenance = {
            schema: 'ger1e-release-provenance/v1',
            repository: process.env.GITHUB_REPOSITORY,
            sourceSha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            refName: process.env.GITHUB_REF_NAME,
            releaseVersion,
            workflow: process.env.GITHUB_WORKFLOW,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            runnerOs: process.env.RUNNER_OS,
            runnerArch: process.env.RUNNER_ARCH,
            nodeVersion: process.version,
            npmVersion: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
          };
          writeFileSync('build-provenance.json', `${JSON.stringify(provenance, null, 2)}\n`, 'utf8');
          NODE
          sha256sum \
            release-manifest.json \
            sbom.cdx.json \
            sbom.spdx.json \
            build-provenance.json \
            > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            release-manifest.json
            sbom.cdx.json
            sbom.spdx.json
            build-provenance.json
            SHA256SUMS

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-${{ github.sha }}
          path: |
            release-manifest.json
            sbom.cdx.json
            sbom.spdx.json
            build-provenance.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Verification-only summary
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: |
          echo 'Verification-only run complete; signed provenance was recorded and no tag or GitHub Release was created.'
          cat SHA256SUMS

  publish:
    needs:
      - verify
      - attest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets-${{ github.sha }}
          path: .

      - name: Refuse release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$MANUAL_TAG"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to overwrite."
            exit 1
          fi

      - name: Create or verify manual version tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            test "$existing" = "$GITHUB_SHA" || {
              echo "::error::Tag $TAG already exists at $existing, not verified source $GITHUB_SHA."
              exit 1
            }
          else
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" \
              -f "sha=${GITHUB_SHA}" >/dev/null
          fi

      - name: Publish GitHub release once
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$MANUAL_TAG"
          fi
          assets=(release-manifest.json sbom.cdx.json sbom.spdx.json build-provenance.json SHA256SUMS)
          gh release create "$tag" \
            --verify-tag \
            --title "$tag" \
            --generate-notes \
            "${assets[@]}"
