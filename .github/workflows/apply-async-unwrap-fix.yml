name: Apply async unwrap fix

on:
  push:
    branches:
      - fix/mcp-async-worker-oidc
    paths:
      - .github/workflows/apply-async-unwrap-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: fix/mcp-async-worker-oidc
      - name: Patch exact async unwrap defect and remove this helper
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/mcp/server.js')
          s = p.read_text()
          old = "async function unwrap(result) {\n  if (!result || result.status < 200 || result.status >= 300) {"
          new = "async function unwrap(resultOrPromise) {\n  const result = await resultOrPromise;\n  if (!result || result.status < 200 || result.status >= 300) {"
          if s.count(old) != 1:
              raise SystemExit('expected unwrap pattern exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/apply-async-unwrap-fix.yml
          git diff --check
          git diff -- src/mcp/server.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mcp/server.js .github/workflows/apply-async-unwrap-fix.yml
          git commit -m 'fix: await async MCP handler responses'
          git push origin HEAD:fix/mcp-async-worker-oidc
