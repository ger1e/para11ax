name: User Scanner worker auth

on:
  pull_request:
    branches:
      - main
    paths:
      - 'workers/user-scanner/**'
      - '.github/workflows/user-scanner-worker-auth.yml'
  push:
    branches:
      - main
    paths:
      - 'workers/user-scanner/**'
      - '.github/workflows/user-scanner-worker-auth.yml'

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install worker auth dependency
        run: python3 -m pip install --disable-pip-version-check 'PyJWT[crypto]==2.13.0'
      - name: Test fail-closed service authentication
        working-directory: workers/user-scanner
        run: python3 -m unittest discover -s tests -v
      - name: Compile worker Python
        run: python3 -m compileall -q workers/user-scanner
