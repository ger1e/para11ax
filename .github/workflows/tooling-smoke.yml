name: Tooling smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tooling-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Tooling smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Verify runner tools
        id: tools
        run: |
          command -v jq >/dev/null
          command -v shellcheck >/dev/null
          command -v python3 >/dev/null
          command -v pwsh >/dev/null

      - name: Validate locked dependencies
        id: dependency_checks
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev

      - name: Validate MAXX invariants and Node tests
        id: node_checks
        run: npm run check

      - name: Validate Maltego tests
        id: maltego_tests
        run: |
          python3 --version
          cd maltego
          python3 -m unittest discover -s tests -v

      - name: Compile Maltego Python
        id: python_compile
        run: python3 -m compileall -q maltego

      - name: Validate Maltego shell
        id: shell_checks
        run: |
          bash -n maltego/install.sh
          shellcheck maltego/install.sh

      - name: Validate PowerShell syntax
        id: powershell_syntax
        shell: pwsh
        run: |
          $files = @(
            'scripts/bootstrap-vercel.ps1',
            'scripts/configure-vercel-firewall.ps1',
            'scripts/finalize.ps1',
            'maltego/install.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "PowerShell syntax errors in $file"
              $parseErrors | ForEach-Object { Write-Host $_.Message }
              exit 1
            }
          }

  publish_status:
    name: Publish Tooling smoke status
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish authoritative Tooling smoke status for exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${STATUS_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Invalid status SHA' >&2
            exit 1
          fi
          state='failure'
          description='Tooling smoke validation failed'
          if [[ "${VALIDATION_RESULT}" == 'success' ]]; then
            state='success'
            description='Tooling smoke passed on Ubuntu'
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc \
            --arg state "${state}" \
            --arg context 'Tooling smoke' \
            --arg description "${description}" \
            --arg target_url "${target_url}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -d "${payload}"
