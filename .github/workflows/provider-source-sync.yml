name: Provider source truth sync

on:
  push:
    branches:
      - fix/provider-source-qa-20260912

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/provider-source-qa-20260912
      - name: Apply exact source-truth updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'test/manifest-invariants.test.js': [
              ('registry.names().length, 38', 'registry.names().length, 39'),
            ],
            'test/provider-admission-v8.test.js': [
              ("  'cisa-kev': ['authoritative', 'periodic'],\n", "  'cisa-kev': ['authoritative', 'periodic'],\n  'cisa-adp': ['authoritative', 'near_real_time'],\n"),
              ("test('all 38 canonical providers", "test('all 39 canonical providers"),
              ('Object.keys(PROVIDER_MANIFEST).length, 38', 'Object.keys(PROVIDER_MANIFEST).length, 39'),
              ('ALL_PROVIDERS.length, 38', 'ALL_PROVIDERS.length, 39'),
            ],
            'test/v8-train2-routing.test.js': [
              ("test('Train 2 activates exactly 38 providers", "test('Train 2 activates exactly 39 providers"),
              ('ALL_PROVIDERS.length, 38', 'ALL_PROVIDERS.length, 39'),
            ],
            'test/public-intel-providers.test.js': [
              ("for (const name of ['threatminer', 'dshield', 'circl-vulnerability',", "for (const name of ['threatminer', 'dshield', 'cisa-adp', 'circl-vulnerability',"),
              ("WORKFLOWS.cve, ['cisa-kev', 'epss'", "WORKFLOWS.cve, ['cisa-kev', 'cisa-adp', 'epss'"),
            ],
            'test/workflows.test.js': [
              ("WORKFLOWS.cve, ['cisa-kev', 'epss'", "WORKFLOWS.cve, ['cisa-kev', 'cisa-adp', 'epss'"),
            ],
            'README.md': [
              ('PARA11AX has **38 configured sources**', 'PARA11AX has **39 configured sources**'),
              ('<summary><strong>38 upstream APIs and feeds</strong></summary>', '<summary><strong>39 upstream APIs and feeds</strong></summary>'),
              ('**Vulnerability / ATT&CK:** CISA KEV · FIRST EPSS', '**Vulnerability / ATT&CK:** CISA KEV · CISA ADP SSVC · FIRST EPSS'),
            ],
            'landing-maxx.html': [
              ('<span class="metric-label">fixed sources</span><span class="metric-value">38</span>', '<span class="metric-label">fixed sources</span><span class="metric-value">39</span>'),
              ('38 FIXED SOURCES // READ-ONLY // FIXED EGRESS', '39 FIXED SOURCES // READ-ONLY // FIXED EGRESS'),
              ('CISA KEV · FIRST EPSS · NVD · OSV', 'CISA KEV · CISA ADP SSVC · FIRST EPSS · NVD · OSV'),
            ],
          }

          for path, pairs in replacements.items():
            p = Path(path)
            text = p.read_text()
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'missing expected source truth in {path}: {old}')
              text = text.replace(old, new)
            p.write_text(text)
          PY
          git diff --check
      - name: Commit source truth
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md landing-maxx.html test/manifest-invariants.test.js test/provider-admission-v8.test.js test/public-intel-providers.test.js test/v8-train2-routing.test.js test/workflows.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'docs: align canonical 39-source fabric'
          git push origin HEAD:fix/provider-source-qa-20260912
