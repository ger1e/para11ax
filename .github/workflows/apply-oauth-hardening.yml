name: Apply OAuth hardening

on:
  push:
    branches:
      - diag/codeql-pr244-20260912
    paths:
      - .github/workflows/apply-oauth-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/full-mcp-ga-conformance-20260911
          fetch-depth: 0

      - name: Replace fast-hash token envelope with AES-256-GCM
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/mcp/oauth.js')
          source = path.read_text()
          old_import = "import { createHash, createHmac, randomBytes, scryptSync, timingSafeEqual } from 'node:crypto';"
          new_import = "import { createCipheriv, createDecipheriv, createHash, randomBytes, scryptSync, timingSafeEqual } from 'node:crypto';"
          if old_import not in source:
              raise SystemExit('expected crypto import not found')
          source = source.replace(old_import, new_import, 1)

          start = source.index('function encode(value) {')
          end = source.index('function validTimes(payload, nowSeconds, maxLifetime) {')
          replacement = r'''const TOKEN_PREFIX = 'p1';
          const TOKEN_AAD = Buffer.from('para11ax:mcp-oauth:sealed-token:v2', 'utf8');

          function tokenKey(secret) {
            return scryptSync(secret, 'para11ax:mcp-oauth:token-key:v2', 32);
          }

          function sealToken(payload, secret) {
            const iv = randomBytes(12);
            const cipher = createCipheriv('aes-256-gcm', tokenKey(secret), iv);
            cipher.setAAD(TOKEN_AAD);
            const plaintext = Buffer.from(JSON.stringify(payload), 'utf8');
            const ciphertext = Buffer.concat([cipher.update(plaintext), cipher.final()]);
            const tag = cipher.getAuthTag();
            return `${TOKEN_PREFIX}.${iv.toString('base64url')}.${ciphertext.toString('base64url')}.${tag.toString('base64url')}`;
          }

          function openSealedToken(token, secret) {
            if (typeof token !== 'string' || token.length < 32 || token.length > 8192) return null;
            const parts = token.split('.');
            if (parts.length !== 4 || parts[0] !== TOKEN_PREFIX || parts.slice(1).some(part => !part)) return null;
            try {
              const iv = Buffer.from(parts[1], 'base64url');
              const ciphertext = Buffer.from(parts[2], 'base64url');
              const tag = Buffer.from(parts[3], 'base64url');
              if (iv.length !== 12 || tag.length !== 16 || ciphertext.length < 2 || ciphertext.length > 6144) return null;
              const decipher = createDecipheriv('aes-256-gcm', tokenKey(secret), iv);
              decipher.setAAD(TOKEN_AAD);
              decipher.setAuthTag(tag);
              const plaintext = Buffer.concat([decipher.update(ciphertext), decipher.final()]);
              const payload = JSON.parse(plaintext.toString('utf8'));
              if (!payload || typeof payload !== 'object' || Array.isArray(payload)) return null;
              return payload;
            } catch {
              return null;
            }
          }

          '''
          source = source[:start] + replacement + source[end:]
          source = source.replace('return sign({', 'return sealToken({')
          source = source.replace('verifySignature(code, secret)', 'openSealedToken(code, secret)')
          source = source.replace('verifySignature(token, secret)', 'openSealedToken(token, secret)')

          forbidden = ['createHmac', 'HS256', 'signingKey(', 'function sign(', 'function verifySignature(']
          remaining = [item for item in forbidden if item in source]
          if remaining:
              raise SystemExit(f'forbidden legacy crypto remains: {remaining}')
          if source.count('sealToken({') != 3:
              raise SystemExit('expected three sealed-token issuers')
          if source.count('openSealedToken(') != 4:
              raise SystemExit('expected helper plus three sealed-token readers')
          path.write_text(source)
          PY
          git diff --check
          git diff -- src/mcp/oauth.js

      - name: Commit OAuth hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mcp/oauth.js
          git commit -m 'fix: seal OAuth grants with authenticated encryption'
          git push origin HEAD:fix/full-mcp-ga-conformance-20260911
