name: Temporary apply MCP scanner fix

on:
  push:
    branches:
      - fix/mcp-async-user-scanner-oidc

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/mcp-async-user-scanner-oidc
      - name: Apply exact source patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/mcp/server.js',
              """async function unwrap(result) {\n  if (!result || result.status < 200 || result.status >= 300) {""",
              """async function unwrap(resultOrPromise) {\n  const result = await resultOrPromise;\n  if (!result || result.status < 200 || result.status >= 300) {""",
          )

          replace_once(
              'src/user-scanner.js',
              "const SAFE_NAME = /^[a-z0-9._-]{1,64}$/i;\n",
              "const SAFE_NAME = /^[a-z0-9._-]{1,64}$/i;\nconst DEFAULT_PRODUCTION_WORKER_URL = 'https://user-scanner-git-main-geri6.vercel.app/scan';\n",
          )

          marker = """function workerUrl(value) {\n  if (!value) return null;\n  let parsed;\n  try { parsed = new URL(value); } catch { throw new Error('invalid_user_scanner_worker_url'); }\n  const localhost = ['127.0.0.1', 'localhost', '::1'].includes(parsed.hostname);\n  if (parsed.protocol !== 'https:' && !(localhost && parsed.protocol === 'http:')) throw new Error('invalid_user_scanner_worker_url');\n  parsed.hash = '';\n  return parsed.toString();\n}\n"""
          replacement = marker + """\nfunction resolveWorkerUrl(env) {\n  const configured = workerUrl(env.PARA11AX_USER_SCANNER_URL);\n  if (configured) return configured;\n  if (env.VERCEL === '1' && env.VERCEL_ENV === 'production') return DEFAULT_PRODUCTION_WORKER_URL;\n  return null;\n}\n"""
          replace_once('src/user-scanner.js', marker, replacement)
          replace_once('src/user-scanner.js', 'try { url = workerUrl(env.PARA11AX_USER_SCANNER_URL); }', 'try { url = resolveWorkerUrl(env); }')
          replace_once(
              'src/user-scanner.js',
              """    const headers = { 'Content-Type': 'application/json' };\n    if (env.PARA11AX_USER_SCANNER_TOKEN) headers.Authorization = `Bearer ${env.PARA11AX_USER_SCANNER_TOKEN}`;\n""",
              """    const headers = { 'Content-Type': 'application/json' };\n    const staticWorkerToken = typeof env.PARA11AX_USER_SCANNER_TOKEN === 'string' ? env.PARA11AX_USER_SCANNER_TOKEN.trim() : '';\n    const workloadToken = typeof env.VERCEL_OIDC_TOKEN === 'string' ? env.VERCEL_OIDC_TOKEN.trim() : '';\n    if (staticWorkerToken) {\n      headers.Authorization = `Bearer ${staticWorkerToken}`;\n    } else if (workloadToken) {\n      headers.Authorization = `Bearer ${workloadToken}`;\n      headers['x-vercel-trusted-oidc-idp-token'] = workloadToken;\n    } else {\n      return errorResponse(503, 'user_scanner_auth_unconfigured');\n    }\n""",
          )

          api = Path('workers/user-scanner/api/index.py')
          text = api.read_text()
          anchor = "from worker import run_scan\n\n\n"
          addition = """from worker import run_scan\n\n\nVERCEL_ISSUER = \"https://oidc.vercel.com/geri6\"\nVERCEL_AUDIENCE = \"https://vercel.com/geri6\"\nVERCEL_SUBJECT = \"owner:geri6:project:para11ax:environment:production\"\nVERCEL_OWNER_ID = \"team_hXokufMlDFuhPPT5r8jPf4aH\"\nVERCEL_PROJECT_ID = \"prj_ojUpOTw8x8KOj9CrTs8jih1mrPjo\"\n_JWKS_CLIENT = None\n\n\ndef _verify_vercel_oidc(token: str) -> bool:\n    global _JWKS_CLIENT\n    try:\n        import jwt\n        from jwt import PyJWKClient\n\n        if _JWKS_CLIENT is None:\n            _JWKS_CLIENT = PyJWKClient(f\"{VERCEL_ISSUER}/.well-known/jwks\")\n        key = _JWKS_CLIENT.get_signing_key_from_jwt(token).key\n        claims = jwt.decode(\n            token,\n            key,\n            algorithms=[\"RS256\"],\n            issuer=VERCEL_ISSUER,\n            audience=VERCEL_AUDIENCE,\n            options={\"require\": [\"exp\", \"iat\", \"iss\", \"aud\", \"sub\"]},\n        )\n        return (\n            hmac.compare_digest(str(claims.get(\"sub\", \"\")), VERCEL_SUBJECT)\n            and hmac.compare_digest(str(claims.get(\"owner_id\", \"\")), VERCEL_OWNER_ID)\n            and hmac.compare_digest(str(claims.get(\"project_id\", \"\")), VERCEL_PROJECT_ID)\n            and hmac.compare_digest(str(claims.get(\"environment\", \"\")), \"production\")\n        )\n    except Exception:\n        return False\n\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit('worker api: import anchor mismatch')
          text = text.replace(anchor, addition, 1)
          old_auth = """    def _authorized(self) -> bool:\n        expected = os.environ.get(\"USER_SCANNER_WORKER_TOKEN\", \"\")\n        if not expected:\n            return True\n        supplied = self.headers.get(\"Authorization\", \"\")\n        if not supplied.startswith(\"Bearer \"):\n            return False\n        return hmac.compare_digest(supplied[7:], expected)\n"""
          new_auth = """    def _authorized(self) -> bool:\n        supplied = self.headers.get(\"Authorization\", \"\")\n        if not supplied.startswith(\"Bearer \"):\n            return False\n        token = supplied[7:].strip()\n        if not token:\n            return False\n        expected = os.environ.get(\"USER_SCANNER_WORKER_TOKEN\", \"\").strip()\n        if expected and hmac.compare_digest(token, expected):\n            return True\n        return _verify_vercel_oidc(token)\n"""
          if text.count(old_auth) != 1:
              raise SystemExit('worker api: auth block mismatch')
          api.write_text(text.replace(old_auth, new_auth, 1))

          req = Path('workers/user-scanner/requirements.txt')
          lines = [line for line in req.read_text().splitlines() if line.strip()]
          if 'PyJWT[crypto]==2.10.1' not in lines:
              lines.append('PyJWT[crypto]==2.10.1')
          req.write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mcp/server.js src/user-scanner.js workers/user-scanner/api/index.py workers/user-scanner/requirements.txt
          git commit -m 'fix: await MCP handlers and secure scanner bridge'
          git push origin HEAD:fix/mcp-async-user-scanner-oidc
