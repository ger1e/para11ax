name: Branch hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-hygiene.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prune-merged:
    name: Prune safely archived branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only merged or archive-captured refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          ARCHIVE_BRANCH: archive/stale-branches-20260824
        run: |
          set -euo pipefail

          deleted=0
          preserved=0
          collapse_archive=false
          archived_parents=()

          if [[ "${HEAD_MESSAGE:-}" == *"[collapse-archive]"* ]]; then
            collapse_archive=true
            echo "One-time archive-collapse mode enabled."
            archive_commit=$(gh api "repos/$REPO/git/ref/heads/$ARCHIVE_BRANCH" --jq '.object.sha')
            mapfile -t archived_parents < <(
              gh api "repos/$REPO/commits/$archive_commit" --jq '.parents[].sha'
            )
          fi

          is_archived_parent() {
            local candidate="$1"
            local parent
            for parent in "${archived_parents[@]}"; do
              [[ "$candidate" == "$parent" ]] && return 0
            done
            return 1
          }

          while IFS=$'\t' read -r branch protected original_sha; do
            [[ -z "$branch" ]] && continue
            [[ "$branch" == "$DEFAULT_BRANCH" ]] && continue
            [[ "$branch" == "$ARCHIVE_BRANCH" ]] && continue

            if [[ "$protected" == "true" ]]; then
              echo "PRESERVE protected: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            ahead=$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$branch" --jq '.ahead_by')
            merged_head=false

            if [[ "$ahead" != "0" ]]; then
              merged_head=$(gh pr list \
                --repo "$REPO" \
                --state merged \
                --head "$branch" \
                --limit 100 \
                --json headRefOid \
                --jq "[.[] | select(.headRefOid == \"$original_sha\")] | length > 0")
            fi

            archive_captured=false
            if [[ "$collapse_archive" == "true" ]] && is_archived_parent "$original_sha"; then
              archive_captured=true
            fi

            if [[ "$ahead" != "0" && "$merged_head" != "true" && "$archive_captured" != "true" ]]; then
              echo "PRESERVE unique/unarchived commits ($ahead ahead): $branch"
              preserved=$((preserved + 1))
              continue
            fi

            current_sha=$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')
            if [[ "$current_sha" != "$original_sha" ]]; then
              echo "PRESERVE changed during run: $branch"
              preserved=$((preserved + 1))
              continue
            fi

            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
            deleted=$((deleted + 1))

            if [[ "$archive_captured" == "true" ]]; then
              echo "DELETED archive-captured branch: $branch"
            elif [[ "$merged_head" == "true" ]]; then
              echo "DELETED exact head of merged PR: $branch"
            else
              echo "DELETED fully merged ancestor: $branch"
            fi
          done < <(
            gh api --paginate "repos/$REPO/branches?per_page=100" \
              --jq '.[] | [.name, .protected, .commit.sha] | @tsv'
          )

          echo "Deleted: $deleted"
          echo "Preserved: $preserved"
